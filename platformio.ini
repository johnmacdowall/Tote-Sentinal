; Tote level monitor — Waveshare ESP32-C6-LCD-1.3 + 3x HC-SR04
; Uses the pioarduino platform: the stock PlatformIO espressif32 platform
; does not support the ESP32-C6 with Arduino.

[env:waveshare-c6-lcd]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/54.03.20/platform-espressif32.zip
board = esp32-c6-devkitm-1
framework = arduino
board_upload.flash_size = 4MB

; Change COM5 to your board's port (Device Manager -> Ports (COM & LPT),
; listed as "USB Serial Device" or "USB JTAG/serial debug unit").
; Delete these two lines to let PlatformIO auto-detect instead.
upload_port = COM7
monitor_port = COM7
upload_speed = 921600
monitor_speed = 115200
build_flags =
  -DARDUINO_USB_MODE=1
  -DARDUINO_USB_CDC_ON_BOOT=1
lib_deps =
  adafruit/Adafruit GFX Library@^1.11.9
  adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4